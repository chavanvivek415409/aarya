<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Aarya ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #ffeef5);
            overflow: hidden;
        }

        .card {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 45px 25px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .heart {
            font-size: 65px;
            margin-bottom: 10px;
            animation: heartbeat 1.3s infinite;
        }

        h1 {
            color: #e91e63;
            font-size: 32px;
            margin-bottom: 15px;
        }

        .question {
            font-size: 21px;
            color: #444;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 70px;
        }

        button {
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        .yes {
            background: #e91e63;
            color: white;
        }

        .no {
            background: #eeeeee;
            color: #555;
            position: relative;
        }

        .next-button {
            background: #e91e63;
            color: white;
            margin-top: 20px;
            padding: 15px 30px;
        }

        .next-button:hover {
            transform: scale(1.08);
        }

        .date-input {
            width: 100%;
            max-width: 280px;
            padding: 15px;
            border: 2px solid #f3b4ca;
            border-radius: 15px;
            font-size: 18px;
            text-align: center;
            outline: none;
            margin-top: 10px;
        }

        .date-input:focus {
            border-color: #e91e63;
        }

        .error {
            color: #e91e63;
            font-size: 15px;
            margin-top: 12px;
            min-height: 20px;
        }

        .celebration {
            animation: appear 0.7s ease;
        }

        .celebration-emoji {
            font-size: 70px;
            margin-bottom: 10px;
        }

        .celebration-text {
            font-size: 20px;
            color: #555;
            line-height: 1.6;
        }

        @keyframes heartbeat {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .confetti {
            position: fixed;
            top: -20px;
            font-size: 25px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            to {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="card" id="mainCard">

        <div class="heart">❤️</div>

        <h1>Hey Aarya!</h1>

        <div class="question">
            I have a very important question for you... 🥺
            <br><br>
            Will you go on a date with me?
        </div>

        <div class="buttons">

            <button class="yes" id="yesButton" onclick="sayYes()">
                YES ❤️
            </button>

            <button class="no" id="noButton">
                NO 😏
            </button>

        </div>

    </div>


    <script>

        const noButton = document.getElementById("noButton");
        const yesButton = document.getElementById("yesButton");

        let attempts = 0;

        const messages = [
            "Are you sure? 🤨",
            "Really? 😭",
            "Think again! 😂",
            "Nice try 😏",
            "You can't escape ❤️",
            "Just say YES! 🥺",
            "Come on Aarya! 😭❤️",
            "The YES button is right there! 😂"
        ];


        noButton.addEventListener("mouseenter", moveNoButton);
        noButton.addEventListener("touchstart", moveNoButton);


        function moveNoButton() {

            attempts++;

            if (attempts <= messages.length) {
                noButton.innerText = messages[attempts - 1];
            }

            const buttonWidth = noButton.offsetWidth;
            const buttonHeight = noButton.offsetHeight;

            const maxX = window.innerWidth - buttonWidth - 20;
            const maxY = window.innerHeight - buttonHeight - 20;

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            noButton.style.position = "fixed";
            noButton.style.left = randomX + "px";
            noButton.style.top = randomY + "px";

            const newSize = 18 + attempts * 2;

            yesButton.style.fontSize = newSize + "px";
            yesButton.style.padding =
                (14 + attempts) + "px " +
                (28 + attempts * 2) + "px";
        }


        function sayYes() {

            const card = document.getElementById("mainCard");

            card.innerHTML = `
                <div class="celebration">

                    <div class="celebration-emoji">
                        🎉❤️🎉
                    </div>

                    <h1>
                        YAY! Aarya! ❤️
                    </h1>

                    <div class="celebration-text">
                        I knew you'd say YES! 😌
                        <br><br>
                        Okay... now let's plan our date. 👀
                    </div>

                    <button class="next-button" onclick="chooseDate()">
                        Let's Plan It 💕
                    </button>

                </div>
            `;

            createConfetti();
        }


        function chooseDate() {

            const card = document.getElementById("mainCard");

            const today = new Date();

            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, "0");
            const day = String(today.getDate()).padStart(2, "0");

            const todayString = `${year}-${month}-${day}`;

            card.innerHTML = `

                <div class="celebration">

                    <div class="celebration-emoji">
                        📅❤️
                    </div>

                    <h1>
                        When should we go?
                    </h1>

                    <div class="question">
                        Pick a date for our little adventure. 😊
                    </div>

                    <input
                        type="date"
                        id="datePicker"
                        class="date-input"
                        min="${todayString}"
                    >

                    <div class="error" id="dateError"></div>

                    <button
                        class="next-button"
                        onclick="selectDate()">
                        Next →
                    </button>

                </div>
            `;
        }


        function selectDate() {

            const datePicker = document.getElementById("datePicker");
            const error = document.getElementById("dateError");

            if (datePicker.value === "") {

                error.innerText =
                    "You have to pick a date! 😌";

                return;
            }

            const selectedDate = datePicker.value;

            showTimeScreen(selectedDate);
        }


        function showTimeScreen(selectedDate) {

            const card = document.getElementById("mainCard");

            card.innerHTML = `

                <div class="celebration">

                    <div class="celebration-emoji">
                        🕐❤️
                    </div>

                    <h1>
                        And what time?
                    </h1>

                    <div class="question">
                        What time should I pick you up? 👀
                    </div>

                    <input
                        type="time"
                        id="timePicker"
                        class="date-input"
                    >

                    <div class="error" id="timeError"></div>

                    <button
                        class="next-button"
                        onclick="selectTime('${selectedDate}')">
                        Next →
                    </button>

                </div>
            `;
        }


        function selectTime(selectedDate) {

            const timePicker = document.getElementById("timePicker");
            const error = document.getElementById("timeError");

            if (timePicker.value === "") {

                error.innerText =
                    "You have to pick a time! 😌";

                return;
            }

            const selectedTime = timePicker.value;

            showFinalScreen(selectedDate, selectedTime);
        }


        function showFinalScreen(selectedDate, selectedTime) {

            const card = document.getElementById("mainCard");

            const dateObject = new Date(selectedDate + "T00:00:00");

            const formattedDate = dateObject.toLocaleDateString(
                "en-IN",
                {
                    weekday: "long",
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            );

            const timeObject = new Date(
                "2000-01-01T" + selectedTime
            );

            const formattedTime = timeObject.toLocaleTimeString(
                "en-IN",
                {
                    hour: "numeric",
                    minute: "2-digit"
                }
            );

            card.innerHTML = `

                <div class="celebration">

                    <div class="celebration-emoji">
                        💕🥰💕
                    </div>

                    <h1>
                        IT'S A DATE! ❤️
                    </h1>

                    <div class="celebration-text">

                        <strong>${formattedDate}</strong>

                        <br><br>

                        🕐 ${formattedTime}

                        <br><br>

                        Okay Aarya...
                        <br>
                        It's officially a date. 😌❤️

                    </div>

                </div>
            `;

            createConfetti();
        }


        function createConfetti() {

            const emojis = [
                "❤️",
                "💕",
                "💖",
                "🎉",
                "✨",
                "🥰"
            ];

            for (let i = 0; i < 35; i++) {

                const confetti =
                    document.createElement("div");

                confetti.className = "confetti";

                confetti.innerText =
                    emojis[
                        Math.floor(
                            Math.random() *
                            emojis.length
                        )
                    ];

                confetti.style.left =
                    Math.random() * 100 + "vw";

                confetti.style.animationDuration =
                    (2 + Math.random() * 3) + "s";

                confetti.style.animationDelay =
                    Math.random() * 1.5 + "s";

                document.body.appendChild(confetti);
            }
        }

    </script>

</body>
</html>
